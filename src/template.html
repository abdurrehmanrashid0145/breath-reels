<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Bangers; src: url(../assets/fonts/bangers-latin-400-normal.woff2); }
  @font-face { font-family: Luckiest; src: url(../assets/fonts/luckiest-guy-latin-400-normal.woff2); }
  @font-face { font-family: Titan; src: url(../assets/fonts/titan-one-latin-400-normal.woff2); }
  @font-face { font-family: Lilita; src: url(../assets/fonts/lilita-one-latin-400-normal.woff2); }
  @font-face { font-family: Emoji; src: url(../assets/fonts/NotoColorEmoji.ttf); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 1280px; overflow: hidden; background: #0a6cf0; }
  body { position: relative; color: #fff; }
  .abs { position: absolute; }

  #bg { position: absolute; inset: 0; overflow: hidden; }
  #bg > * { position: absolute; }
  .emoji { font-family: Emoji; line-height: 1; }

  #title { position: absolute; left: 0; right: 0; top: 0; text-align: center; z-index: 10; }
  #title .line { display: table; margin: 0 auto; white-space: nowrap; line-height: 1.02; font-family: var(--title); color: #fff;
    -webkit-text-stroke: var(--stroke) #101018; paint-order: stroke fill; text-shadow: 0 var(--drop) 0 #101018; letter-spacing: 1px; }
  #title .line.sub { color: var(--sub); }

  #bar { position: absolute; border-radius: 6px; background: #fff; border: 3px solid #101018; z-index: 4; }
  .node { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #fff; border: 3px solid #101018; z-index: 5; }
  .ring { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 5px solid #fff; z-index: 3; opacity: 0; }

  .lung { position: absolute; z-index: 6; display: flex; align-items: center; justify-content: center; }
  .lung svg, .lung img { width: 100%; height: 100%; object-fit: contain; display: block; overflow: visible; }
  .glow { position: absolute; border-radius: 50%; z-index: 5; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(255,255,255,.25) 40%, transparent 70%); }

  #ball { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; z-index: 20; display: flex; align-items: center; justify-content: center; }
  #ball .face { font-size: 66px; filter: drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
  #handle { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-family: Lilita; font-size: 22px; color: rgba(255,255,255,.85); z-index: 10; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="title"></div>
<div id="bar"></div>
<div id="stage"></div>
<div id="ball"><div class="face emoji"></div></div>
<div id="handle"></div>

<script>
let C, E = {};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 1 - Math.pow(1 - k, 3);
const $ = (tag, cls, parent, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; (parent || document.body).appendChild(e); return e; };
const SVGNS = 'http://www.w3.org/2000/svg';
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------------- lungs (built-in cartoon set; PNG sets in assets/lungs/<name>/ replace these) ----------------
const LOBE_L = 'M107,80 C92,58 58,58 43,90 C27,124 24,172 31,202 C36,222 54,228 74,223 C94,218 106,206 108,188 Z';
const LOBE_R = 'M133,80 C148,58 182,58 197,90 C213,124 216,172 209,202 C204,222 186,228 166,223 C146,218 134,206 132,188 Z';
const OUT = '#2a1414';
function trachea(fill, ring) {
  let s = `<rect x="110" y="14" width="20" height="70" rx="8" fill="${fill}" stroke="${OUT}" stroke-width="3"/>`;
  for (let y = 24; y < 80; y += 10) s += `<line x1="112" y1="${y}" x2="128" y2="${y}" stroke="${ring}" stroke-width="3" stroke-linecap="round"/>`;
  return s + `<path d="M120,80 L120,94 M120,92 Q110,100 100,108 M120,92 Q130,100 140,108" stroke="${fill}" stroke-width="10" stroke-linecap="round" fill="none"/>`;
}
function vessels(color, w) {
  const side = (m) => {
    const x = v => (m ? 240 - v : v);
    return [[100, 108, 70, 120, 52, 128], [100, 108, 84, 140, 60, 170], [100, 108, 98, 150, 86, 198], [84, 124, 72, 112, 62, 98], [76, 150, 62, 152, 46, 150], [92, 168, 78, 186, 64, 206], [95, 140, 104, 160, 102, 184]]
      .map(([a, b, c, d, e, f]) => `<path d="M${x(a)},${b} Q${x(c)},${d} ${x(e)},${f}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`).join('');
  };
  return side(false) + side(true);
}
function lungSVG(state, hue) {
  let s = `<svg xmlns="${SVGNS}" viewBox="-10 0 260 240">`;
  const defs = (id, a, b) => `<radialGradient id="${id}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
  if (state === 0) {
    s += `<defs>${defs('g0', '#8a4a33', '#4a2418')}</defs>` + trachea('#7a4a38', '#4a2a20');
    s += `<path d="${LOBE_L}" fill="url(#g0)" stroke="${OUT}" stroke-width="4"/><path d="${LOBE_R}" fill="url(#g0)" stroke="${OUT}" stroke-width="4"/>`;
    for (const [x, y, r] of [[60, 190, 6], [84, 205, 4], [170, 196, 5], [190, 170, 4], [52, 120, 3], [150, 210, 3]]) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#2a120c" opacity=".7"/>`;
    // band-aids
    s += `<g transform="rotate(-38 176 104)"><rect x="150" y="94" width="52" height="20" rx="9" fill="#f3d6a8" stroke="${OUT}" stroke-width="2.5"/><rect x="168" y="96" width="16" height="16" fill="#e6bf8a"/></g>`;
    s += `<g transform="rotate(42 62 196)"><rect x="40" y="187" width="46" height="18" rx="8" fill="#f3d6a8" stroke="${OUT}" stroke-width="2.5"/><rect x="56" y="189" width="14" height="14" fill="#e6bf8a"/></g>`;
    // tired eyes, sad mouths, tear
    for (const cx of [76, 164]) {
      s += `<ellipse cx="${cx - 12}" cy="128" rx="11" ry="10" fill="#fff" stroke="${OUT}" stroke-width="2.5"/><ellipse cx="${cx + 12}" cy="128" rx="11" ry="10" fill="#fff" stroke="${OUT}" stroke-width="2.5"/>`;
      s += `<circle cx="${cx - 12}" cy="133" r="4.5" fill="#111"/><circle cx="${cx + 12}" cy="133" r="4.5" fill="#111"/>`;
      s += `<path d="M${cx - 24},127 Q${cx - 12},${116} ${cx},127 Z M${cx},127 Q${cx + 12},116 ${cx + 24},127 Z" fill="#6a3424" stroke="${OUT}" stroke-width="2.5"/>`;
      s += `<path d="M${cx - 10},164 Q${cx},154 ${cx + 10},164" stroke="${OUT}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
    s += `<path d="M58,142 Q52,154 58,158 Q64,154 58,142 Z" fill="#8fd8ff" stroke="#2a6a9a" stroke-width="1.5"/>`;
  } else if (state === 1) {
    s += `<defs>${defs('g1a', '#e36a74', '#9e2a3a')}${defs('g1b', '#6e4c3c', '#2e1c16')}</defs>` + trachea('#9a5a4a', '#5a3028');
    s += `<path d="${LOBE_L}" fill="url(#g1a)" stroke="${OUT}" stroke-width="4"/><path d="${LOBE_R}" fill="url(#g1b)" stroke="${OUT}" stroke-width="4"/>`;
    s += vessels('rgba(110,20,30,.55)', 2.5);
    for (const [x, y, r] of [[160, 120, 9], [182, 150, 7], [158, 180, 10], [196, 196, 6], [176, 92, 5], [60, 196, 6], [82, 176, 4]]) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#140806" opacity=".8"/>`;
    for (const cx of [76, 164]) {
      s += `<circle cx="${cx - 12}" cy="132" r="5" fill="#111"/><circle cx="${cx + 12}" cy="132" r="5" fill="#111"/>`;
      s += `<path d="M${cx - 12},160 q6,-6 12,0 q6,6 12,0" stroke="${OUT}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
    s += `<path d="M150,64 Q146,74 150,78 Q154,74 150,64 Z" fill="#8fd8ff" stroke="#2a6a9a" stroke-width="1.5" transform="translate(30 64)"/>`;
  } else if (state === 2) {
    s += `<defs>${defs('g2', '#ff7f8c', '#c8304a')}</defs>` + trachea('#f08a98', '#b04458');
    s += `<path d="${LOBE_L}" fill="url(#g2)" stroke="${OUT}" stroke-width="4"/><path d="${LOBE_R}" fill="url(#g2)" stroke="${OUT}" stroke-width="4"/>`;
    s += vessels('#ffd0d8', 3);
    for (const cx of [76, 164]) {
      s += `<circle cx="${cx - 12}" cy="132" r="5.5" fill="#111"/><circle cx="${cx + 12}" cy="132" r="5.5" fill="#111"/><circle cx="${cx - 10}" cy="130" r="1.8" fill="#fff"/><circle cx="${cx + 14}" cy="130" r="1.8" fill="#fff"/>`;
      s += `<path d="M${cx - 10},156 Q${cx},166 ${cx + 10},156" stroke="${OUT}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
  } else {
    s += `<defs>${defs('g3', '#ffd0dc', '#ff8aa6')}</defs>`;
    // flexing arms (drawn first so the lobes overlap the shoulders)
    for (const m of [false, true]) {
      const x = v => (m ? 240 - v : v);
      const arm = `M${x(40)},140 L${x(4)},150 L${x(-2)},104`;
      s += `<path d="${arm}" stroke="${OUT}" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      s += `<path d="${arm}" stroke="#ff9cb4" stroke-width="23" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      s += `<circle cx="${x(18)}" cy="132" r="15" fill="#ff9cb4" stroke="${OUT}" stroke-width="3"/>`;
      s += `<circle cx="${x(-2)}" cy="96" r="15" fill="#ff9cb4" stroke="${OUT}" stroke-width="3"/>`;
      s += `<path d="M${x(-10)},92 h${m ? -14 : 14} M${x(-10)},100 h${m ? -14 : 14}" stroke="${OUT}" stroke-width="2" opacity=".5"/>`;
    }
    s += trachea('#ffb3c4', '#e0708a');
    s += `<path d="${LOBE_L}" fill="url(#g3)" stroke="${OUT}" stroke-width="4"/><path d="${LOBE_R}" fill="url(#g3)" stroke="${OUT}" stroke-width="4"/>`;
    s += `<ellipse cx="60" cy="100" rx="9" ry="14" fill="#fff" opacity=".55"/><ellipse cx="180" cy="100" rx="9" ry="14" fill="#fff" opacity=".55"/>`;
    for (const cx of [76, 164]) {
      s += `<path d="M${cx - 19},134 Q${cx - 12},124 ${cx - 5},134 M${cx + 5},134 Q${cx + 12},124 ${cx + 19},134" stroke="${OUT}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M${cx - 10},150 Q${cx},164 ${cx + 10},150" stroke="${OUT}" stroke-width="3.5" fill="#c23a5a" stroke-linecap="round"/>`;
      s += `<ellipse cx="${cx - 22}" cy="148" rx="7" ry="4" fill="#ff5e86" opacity=".5"/><ellipse cx="${cx + 22}" cy="148" rx="7" ry="4" fill="#ff5e86" opacity=".5"/>`;
    }
  }
  return s + '</svg>';
}

// ---------------- background: medical blue, grid, ECG line, floating icons ----------------
const ICONS = {
  heart: '<path d="M0,8 C-14,-4 -10,-16 0,-8 C10,-16 14,-4 0,8 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M-6,-1 h5 M-3.5,-3.5 v5" stroke="currentColor" stroke-width="2"/>',
  plus: '<path d="M-4,-11 h8 v7 h7 v8 h-7 v7 h-8 v-7 h-7 v-8 h7 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  lung: '<path d="M-2,-12 v8 M-2,-4 q-3,3 -6,4 M-2,-4 q3,3 6,4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M-4,-6 C-10,-10 -16,-2 -15,6 C-14,12 -6,12 -4,8 Z M0,-6 C6,-10 12,-2 11,6 C10,12 2,12 0,8 Z" fill="none" stroke="currentColor" stroke-width="2.2" transform="translate(2 0)"/>',
  pulse: '<path d="M-14,0 h7 l3,-8 l5,16 l4,-12 l2,4 h7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>',
};
function ecgPath(w, amp) {
  let d = 'M0,0', x = 0;
  while (x < w) { d += ` L${x + 30},0 L${x + 42},${-amp * 0.25} L${x + 50},0 L${x + 58},${amp * 0.3} L${x + 70},${-amp} L${x + 82},${amp * 0.55} L${x + 94},0 L${x + 120},${-amp * 0.2} L${x + 140},0`; x += 140; }
  return d;
}
function buildBackground() {
  const bg = document.getElementById('bg'), b = C.bg, h = b.hue;
  bg.style.background = `linear-gradient(${b.angle}deg, hsl(${h},${b.sat}%,${b.light + 8}%) 0%, hsl(${h + 8},${b.sat}%,${b.light}%) 55%, hsl(${h + 14},${b.sat}%,${b.light - 6}%) 100%)`;
  $('div', '', bg, `inset:0; background: radial-gradient(ellipse at ${b.spotX}% ${b.spotY}%, hsla(${h - 10},100%,80%,.45) 0%, transparent 55%)`);
  const g = b.grid;
  $('div', '', bg, `inset:0; background-image: linear-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.16) 1.5px, transparent 1.5px); background-size: ${g}px ${g}px; background-position: ${b.gx}px ${b.gy}px`);
  $('div', '', bg, `inset:0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: ${g / 2}px ${g / 2}px; background-position: ${b.gx}px ${b.gy}px`);
  E.ecg = b.ecg.map(e => {
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('width', 1440); svg.setAttribute('height', 200);
    svg.style.cssText = `position:absolute; left:0; top:${e.y - 100}px; opacity:${e.o}`;
    svg.innerHTML = `<path d="${ecgPath(1440, e.amp)}" transform="translate(0 100)" fill="none" stroke="hsl(${h - 15},100%,82%)" stroke-width="3" stroke-linejoin="round"/>`;
    bg.appendChild(svg);
    return { el: svg, speed: e.speed };
  });
  E.icons = b.icons.map(ic => {
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '-30 -30 60 60');
    svg.style.cssText = `position:absolute; width:${ic.s}px; height:${ic.s}px; left:${ic.x}px; top:${ic.y}px; color: hsl(${h - 15},100%,85%); opacity:${ic.o}`;
    svg.innerHTML = `<path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z" fill="hsla(${h},100%,90%,.08)" stroke="currentColor" stroke-width="2.2"/>${ICONS[b.icon]}`;
    bg.appendChild(svg);
    return { el: svg, ...ic };
  });
  E.motes = b.motes.map(m => { const d = $('div', '', bg, `width:${m.r}px; height:${m.r}px; border-radius:50%; background: rgba(255,255,255,.35); left:${m.x}px; top:${m.y}px`); return { el: d, ...m }; });
}
function animateBackground(t) {
  for (const e of E.ecg) e.el.style.transform = `translateX(${-((t * e.speed) % 140)}px)`;
  for (const ic of E.icons) ic.el.style.transform = `translate(${Math.sin(t * 0.4 + ic.ph) * 8}px, ${Math.cos(t * 0.33 + ic.ph) * 10}px) rotate(${Math.sin(t * 0.25 + ic.ph) * 8}deg)`;
  for (const m of E.motes) m.el.style.transform = `translateY(${-((t * m.v) % 160)}px)`;
}

// ---------------- layout ----------------
function buildTitle() {
  const el = document.getElementById('title');
  el.style.setProperty('--title', C.titleFont);
  el.style.setProperty('--sub', C.titleColor);
  el.innerHTML = '';
  C.title.forEach((txt, i) => { const s = $('span', 'line' + (i ? ' sub' : ''), el); s.textContent = txt; });
  el.style.top = '14px';
}
function fitText() {
  const el = document.getElementById('title');
  const lines = [...el.children];
  const max = lines.length > 1 ? [98, 60] : [112];
  lines.forEach((s, i) => {
    let f = max[i];
    s.style.fontSize = f + 'px';
    s.style.setProperty('--stroke', Math.round(f * 0.13) + 'px');
    s.style.setProperty('--drop', Math.round(f * 0.07) + 'px');
    while (s.scrollWidth > 690 && f > 30) { f -= 2; s.style.fontSize = f + 'px'; s.style.setProperty('--stroke', Math.round(f * 0.13) + 'px'); s.style.setProperty('--drop', Math.round(f * 0.07) + 'px'); }
  });
  // everything below the title starts under it
  const bottom = el.offsetTop + el.offsetHeight;
  layout(bottom + 12);
}
function layout(top) {
  const L = C.geo = {};
  const right = C.side === 'right';
  L.barX = right ? 720 - 158 : 158;
  L.lungX = right ? 228 : 492;
  L.top = top; L.bottom = 1050; // leaves room at the bottom for the app's caption and buttons
  const len = L.bottom - L.top;
  const bar = document.getElementById('bar');
  bar.style.cssText = `left:${L.barX - 14}px; width:28px; top:${L.top}px; height:${len}px`;
  L.nodes = C.nodeFrac.map(f => L.top + len * f);
  L.start = L.top + len * C.startFrac;
  const size = Math.min(240, len * 0.27);
  E.nodes.forEach((n, i) => { n.style.left = L.barX + 'px'; n.style.top = L.nodes[i] + 'px'; E.rings[i].style.left = L.barX + 'px'; E.rings[i].style.top = L.nodes[i] + 'px'; });
  E.lungs.forEach((l, i) => {
    l.style.cssText = `left:${L.lungX - size / 2}px; top:${L.nodes[i] - size / 2}px; width:${size}px; height:${size}px`;
    E.glows[i].style.cssText = `left:${L.lungX - size * 0.7}px; top:${L.nodes[i] - size * 0.7}px; width:${size * 1.4}px; height:${size * 1.4}px`;
  });
}
function init(cfg) {
  C = cfg;
  buildBackground();
  buildTitle();
  const stage = document.getElementById('stage');
  E.nodes = []; E.rings = []; E.lungs = []; E.glows = [];
  for (let i = 0; i < 4; i++) {
    E.rings.push($('div', 'ring', stage));
    E.nodes.push($('div', 'node', stage));
    E.glows.push($('div', 'glow', stage));
    const l = $('div', 'lung', stage);
    if (C.lungImages) { const img = $('img', '', l); img.src = C.lungImages[i]; }
    else l.innerHTML = lungSVG(i);
    if (C.side === 'right' && C.mirrorLungs) l.style.transform = 'scaleX(-1)';
    E.lungs.push(l);
  }
  E.ball = document.getElementById('ball');
  E.face = E.ball.querySelector('.face');
  document.getElementById('handle').textContent = C.handle || '';
  fitText();
}

// ball: drops onto the top of the bar, then slides down, reaching lung k at C.nodeTimes[k]
function ballY(t) {
  const L = C.geo, T = C.nodeTimes;
  if (t < C.dropTime) return L.start;
  const pts = [[C.dropTime, L.start], ...T.map((tt, i) => [tt, L.nodes[i]])];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return L.nodes[3];
}
function reached(t) { let n = 0; C.nodeTimes.forEach(tt => { if (t >= tt) n++; }); return n; }

function render(t) {
  animateBackground(t);
  const n = reached(t);
  const y = ballY(t);
  E.ball.style.left = C.geo.barX + 'px';
  E.ball.style.top = y + 'px';
  E.face.textContent = C.ballFaces[Math.min(n, C.ballFaces.length - 1)];
  // gentle wobble while holding, a squash when it hits each lung
  let sc = t < C.dropTime ? ease(t / C.dropTime) * (1 + 0.25 * Math.sin(t / C.dropTime * Math.PI)) : 1, rot = Math.sin(t * 2.2) * 5;
  C.nodeTimes.forEach(tt => { const d = t - tt; if (d >= 0 && d < 0.5) sc *= 1 + 0.22 * Math.sin(d / 0.5 * Math.PI); });
  if (t > C.hold) rot = Math.sin((t - C.hold) * 6) * 10 * Math.exp(-(t - C.hold));
  E.ball.style.transform = `scale(${sc}) rotate(${rot}deg)`;

  E.lungs.forEach((l, i) => {
    const d = t - C.nodeTimes[i];
    let s = 1 + 0.025 * Math.sin(t * 2 + i * 1.3);              // idle breathing
    if (d >= 0 && d < 0.7) s += 0.2 * Math.sin(d / 0.7 * Math.PI); // pop when the ball arrives
    if (i === 3 && t > C.hold) s += 0.05 * Math.sin((t - C.hold) * 5);
    const flip = C.side === 'right' && C.mirrorLungs ? -1 : 1;
    l.style.transform = `scale(${s * flip}, ${s})`;
    const g = d >= 0 ? (d < 1.2 ? 1 - d / 1.2 * 0.6 : 0.4) * (i === n - 1 ? 1 : 0) : 0;
    E.glows[i].style.opacity = g.toFixed(3);
    const rr = E.rings[i];
    if (d >= 0 && d < 0.8) { rr.style.opacity = (1 - d / 0.8).toFixed(3); rr.style.transform = `scale(${1 + d * 2})`; } else rr.style.opacity = 0;
  });
}
</script>
</body>
</html>
